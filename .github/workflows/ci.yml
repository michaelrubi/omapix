# Formatting, clippy and the tests, on Arch as Omapix's users have it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git rustup lcms2 vulkan-icd-loader wayland libxkbcommon
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
