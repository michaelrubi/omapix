[workspace]
resolver = "3"
members = ["crates/omapix-engine", "crates/omapix"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 4

# Image decoding and colour conversion are too slow unoptimised to test with
# real 24 MP files, so optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
